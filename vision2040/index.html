<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06152a">
<title>[2040.zip] 2040 폴더가 열렸습니다 — 최적화</title>
<style>
:root {color-scheme:dark; --navy:#071a33; --deep:#030b17; --blue:#85c4e5; --muted:#a6b6c8; --white:#ecf4ff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#030b17;font-family:'Pretendard','Noto Sans KR','Malgun Gothic',Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:grid;place-items:center}
.stage{position:relative;width:100vw;height:100svh;height:100dvh;background:radial-gradient(ellipse at 50% 44%,#102c4d 0%,#061426 48%,#02060d 100%);isolation:isolate;overflow:hidden}
.stage:before{content:'';position:absolute;inset:0;opacity:.27;pointer-events:none;background:linear-gradient(180deg,rgba(116,188,223,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(116,188,223,.05) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(ellipse at center,black,transparent 73%)}
.ambient{position:absolute;inset:-20%;background:radial-gradient(ellipse at 50% 58%,rgba(102,180,237,.11),transparent 48%);animation:breathe 5s ease-in-out infinite alternate;pointer-events:none}
@keyframes breathe{to{opacity:.36;transform:scale(1.12)}}
.intro{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:clamp(18px,5vw,56px);transition:opacity .7s ease,visibility .7s ease;}
.intro.hidden{opacity:0;visibility:hidden;pointer-events:none}
.console{width:min(560px,100%);filter:drop-shadow(0 25px 65px rgba(0,0,0,.24));}
.kicker{display:flex;align-items:center;gap:10px;letter-spacing:.22em;color:#a5d1ea;font-size:clamp(10px,1.5vw,12px);font-weight:700;margin:0 0 25px}
.kicker:before{content:'';display:block;width:26px;height:1px;background:currentColor}
.headline{font-size:clamp(32px,6vw,55px);letter-spacing:-.05em;line-height:1.13;font-weight:750;color:white;margin:0 0 13px}
.headline b{font-weight:760;color:#a7d8f4}
.description{font-size:clamp(13px,1.9vw,15px);font-weight:400;color:#b2c7da;line-height:1.7;letter-spacing:-.015em;margin:0 0 35px}
.terminal{border:1px solid rgba(148,202,243,.2);border-radius:13px;background:linear-gradient(145deg,rgba(22,48,79,.74),rgba(6,19,37,.88));overflow:hidden;box-shadow:0 16px 75px rgba(0,0,0,.26)}
.windowbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(160,206,247,.14);padding:13px 17px;background:rgba(147,194,235,.055);gap:10px}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:#91b4cc;opacity:.47}.dots i:first-child{background:#ffc3aa;opacity:1}.dots i:nth-child(2){background:#f8d9a6;opacity:1}.dots i:nth-child(3){background:#9dc6bd;opacity:1}
.window-title{font:500 10px ui-monospace,Consolas,Monaco,monospace;color:#88a9c3;letter-spacing:.12em}
.terminal-main{padding:clamp(21px,4vw,29px)}
.file-row{display:flex;align-items:center;gap:15px;padding:0 0 26px}
.file-icon{width:45px;height:49px;flex:0 0 45px;border-radius:9px;display:grid;place-items:center;background:rgba(104,168,219,.11);color:#c7e5f6;border:1px solid rgba(161,214,244,.23)}
.file-icon svg{width:25px;height:25px}
.filename{font:650 clamp(19px,3.6vw,23px) ui-monospace,Consolas,Monaco,monospace;color:white;letter-spacing:-.03em}
.file-meta{margin-top:4px;color:#8ca9c4;font-size:11px;letter-spacing:.03em}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px;gap:10px}
.progress-label{color:#c8d9e7;font-size:12px;letter-spacing:.04em}
.percentage{font:650 clamp(24px,5vw,32px) ui-monospace,Consolas,Monaco,monospace;color:#c6eaff;font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:999px;background:#10243b;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px rgba(128,171,215,.08)}
.fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#4d87b4,#b9e5ff);box-shadow:0 0 19px rgba(120,207,255,.39);transition:width .14s linear}
.log{font:400 11px ui-monospace,Consolas,Monaco,monospace;color:#83a6c1;letter-spacing:-.015em;line-height:1.8;margin:22px 0 0;min-height:40px}
.log strong{color:#b8e4ff;font-weight:500}
.footer{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:17px;color:#7698b5;font-size:10px;letter-spacing:.13em;text-transform:uppercase}
.footer .blink{display:inline-block;width:6px;height:6px;border-radius:50%;background:#83c8f0;margin-right:8px;box-shadow:0 0 12px rgba(131,200,240,.7);animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:.15}}
.reveal{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .22s ease,visibility 0s linear .22s;background:#07101d}
.reveal.active{opacity:1;visibility:visible;transition:opacity .22s ease}
/* Compositor-friendly reveal: the image itself doesn't animate a huge clip-path or blur. */
.poster{position:absolute;width:100%;height:100%;object-fit:contain;object-position:center center;display:block;opacity:0;transform:scale(1.025);transition:opacity .45s ease,transform 2s ease}
.reveal.show .poster{opacity:1;transform:scale(1)}
.door-panel{position:absolute;z-index:2;top:0;bottom:0;width:50.2%;background:linear-gradient(110deg,#07101d,#0b1c31);pointer-events:none;transition:transform 1.8s cubic-bezier(.21,.72,.21,1)}
.door-left{left:0;border-right:1px solid rgba(197,226,245,.2)}
.door-right{right:0;border-left:1px solid rgba(197,226,245,.2)}
.reveal.show .door-left{transform:translate3d(-101%,0,0)}
.reveal.show .door-right{transform:translate3d(101%,0,0)}
.light{position:absolute;z-index:3;top:0;bottom:0;left:50%;width:11px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(248,242,204,.95),transparent);filter:blur(10px);opacity:0;pointer-events:none}
.reveal.show .light{animation:lightFade 1.6s ease-out forwards}
@keyframes lightFade{0%{opacity:0}23%{opacity:.82}100%{opacity:0}}
.complete{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#e5f5ff;white-space:nowrap;pointer-events:none;opacity:0;font-weight:600;letter-spacing:.03em;font-size:clamp(19px,4vw,32px);text-shadow:0 3px 25px rgba(0,0,0,.7)}
.complete.visible{animation:completeTitle 1.45s ease both}
@keyframes completeTitle{0%{opacity:0;transform:translate(-50%,-35%)}20%{opacity:1;transform:translate(-50%,-50%)}60%{opacity:1}100%{opacity:0;transform:translate(-50%,-67%)}}
.controls{position:fixed;z-index:10;bottom:max(17px,env(safe-area-inset-bottom));right:max(17px,env(safe-area-inset-right));display:flex;gap:9px;opacity:.0;transition:opacity .25s ease}
.stage:hover .controls,.stage:focus-within .controls,.stage.controls-visible .controls{opacity:1}
.control{appearance:none;border:1px solid rgba(231,245,255,.32);border-radius:40px;background:rgba(3,14,31,.62);color:#e6f5ff;padding:10px 14px;cursor:pointer;font-size:12px;letter-spacing:-.02em}
.control:hover{background:rgba(29,67,100,.93)}
.control:focus-visible{outline:2px solid #d4edff;outline-offset:3px}
@media (orientation:portrait){.intro{padding:7.8vw 7vw}.headline{font-size:clamp(29px,8vw,50px)}.description{font-size:clamp(12px,3.1vw,15px)}.console{width:100%}.terminal-main{padding:19px}.footer{font-size:9px}}
@media (prefers-reduced-motion:reduce){.ambient,.footer .blink{animation:none}.poster{transition-duration:.7s}.reveal.show .light{animation:none}}
</style>
</head>

    <div class="door-panel door-left" aria-hidden="true"></div>
    <div class="door-panel door-right" aria-hidden="true"></div>
    <div class="light" aria-hidden="true"></div>
    <div class="complete" id="complete">2040 폴더가 열렸습니다</div>
  </section>
  <div class="controls" aria-label="재생 컨트롤">
    <button class="control" id="skip" title="압축 해제 화면 건너뛰기">건너뛰기</button>
    <button class="control" id="replay" title="처음부터 다시 보기">↻ 다시 재생</button>
  </div>
</main>
<script>
(()=>{
  'use strict';
  const $=id=>document.getElementById(id);
  const intro=$('intro'),reveal=$('reveal'),fill=$('fill'),num=$('number'),bar=$('bar'),status=$('status'),log=$('log'),complete=$('complete'),skip=$('skip'),replay=$('replay');
  const stage=$('stage');
  const DURATION=5100; // 압축 해제 연출 시간(ms)
  const AUTO_REPLAY = new URLSearchParams(location.search).get('loop')==='1'; // ?loop=1 로 반복 재생
  const HOLD=22000; // 반복 재생 시 이미지 유지 시간(ms)
  let raf=0,run=0,timeouts=[],startTime=0,lastPercent=-1,lastPhase=-1;
  const queue=(fn,ms)=>{const id=setTimeout(fn,ms);timeouts.push(id);return id};
  const clear=()=>{cancelAnimationFrame(raf);timeouts.forEach(clearTimeout);timeouts=[]};
  function setProgress(p){
    const val=Math.max(0,Math.min(100,Math.round(p)));
    if(val===lastPercent)return;
    lastPercent=val;fill.style.width=val+'%';num.textContent=String(val);bar.setAttribute('aria-valuenow',String(val));
    const phase=val<17?0:val<44?1:val<76?2:val<100?3:4;
    if(phase===lastPhase)return;lastPhase=phase;
    if(val<17){status.textContent='압축 파일 확인 중';log.innerHTML='&gt; <strong>2040.zip</strong> 무결성 검사 중...'}
    else if(val<44){status.textContent='파일을 추출하고 있습니다';log.innerHTML='&gt; <strong>2040/vision/</strong> 경로 생성 완료<br>&gt; 미래의 기록을 불러오는 중...'}
    else if(val<76){status.textContent='미래의 첫 번째 폴더 생성 중';log.innerHTML='&gt; <strong>2040/our_future/</strong> 압축 해제 중<br>&gt; 함께 만드는 미래 준비 중...'}
    else if(val<100){status.textContent='마지막 파일 정리 중';log.innerHTML='&gt; <strong>2040/our_future/</strong> 파일 복원 완료<br>&gt; 공개 화면 준비 중...'}
    else{status.textContent='압축 해제 완료';log.innerHTML='&gt; <strong>SUCCESS</strong> — 압축 해제 완료<br>&gt; <strong>2040 폴더를 엽니다.</strong>'}
  }
  function openPoster(){
    if(run!==1) return;
    run=2;setProgress(100);
    queue(()=>{intro.classList.add('hidden');reveal.classList.add('active');},350);
    queue(()=>{reveal.classList.add('show');complete.classList.add('visible')},470);
    if(AUTO_REPLAY) queue(reset,DURATION+HOLD);
  }
  function tick(now){
    if(run!==1)return;
    const t=Math.min(1,(now-startTime)/DURATION);
    // 자연스럽게 빨라졌다 느려지는 압축 해제 진행률
    let p;
    if(t<.28)p=21*t/.28;
    else if(t<.54)p=21+((t-.28)/.26)*40;
    else if(t<.83)p=61+((t-.54)/.29)*31;
    else p=92+((t-.83)/.17)*8;
    // 단계별로 부드럽게 이어지는 진행률
    setProgress(Math.min(100,p));
    if(t>=1){openPoster()}else raf=requestAnimationFrame(tick);
  }
  function reset(){
    clear();run=1;
    reveal.classList.remove('show','active');complete.classList.remove('visible');intro.classList.remove('hidden');
    skip.hidden=false;lastPercent=-1;lastPhase=-1;setProgress(0);
    startTime=performance.now();raf=requestAnimationFrame(tick);
  }
  function fastForward(){
    clear();run=1;skip.hidden=true;openPoster();
  }
  skip.addEventListener('click',fastForward);
  replay.addEventListener('click',reset);
  document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')reset();if(e.key==='Escape')fastForward()});
  // 터치 기기에서 컨트롤이 잠시 나타나게 한다.
  let hideControls;
  stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;stage.classList.add('controls-visible');clearTimeout(hideControls);hideControls=setTimeout(()=>stage.classList.remove('controls-visible'),3000)});
  reset();
})();
</script>
