<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf2">
<title>얌얌쑥쑥 | 우리 아이 건강한 한 끼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf2;--card:#fff;--ink:#26342b;--muted:#849087;--green:#438a59;--green2:#e8f3e9;--orange:#ff7b50;--cream:#fff1dc;--line:#eee9df;--red:#ef5350;--shadow:0 8px 24px rgba(70,80,65,.08)}
*{box-sizing:border-box}html{background:#eee}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",sans-serif;min-height:100vh;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
button,input{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg)}
header{padding:calc(20px + env(safe-area-inset-top)) 18px 10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:50%;background:#ffe3bf;display:grid;place-items:center;font-size:27px}.brand h1{margin:0;color:#247340;font-size:25px;letter-spacing:-1.2px}.brand p{margin:0;color:var(--muted);font-size:12px}
.search{margin:10px 18px 14px;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;padding:0 13px}.search input{border:0;outline:0;background:transparent;width:100%;padding:13px 8px;color:var(--ink)}
.section-head{display:flex;align-items:end;justify-content:space-between;padding:2px 18px 10px}.section-head h2{font-size:20px;margin:0}.section-head span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 24px}.meal-card,.recipe-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.meal-card{padding:14px}.meal-title{font-weight:800;font-size:16px}.total{font-size:22px;color:var(--green);font-weight:800;margin:2px 0 10px}.heart{position:absolute;right:10px;top:10px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.94);font-size:21px;color:#a7aea9;z-index:2}.heart.on{color:var(--red)}
.meal-visual{height:112px;border-radius:15px;background:linear-gradient(145deg,#fff2d9,#f4ead8);display:grid;place-items:center;margin-bottom:9px;font-size:54px;overflow:hidden}.meal-visual img,.photo img{width:100%;height:100%;object-fit:cover;object-position:center center}.meal-items{font-size:12px}.meal-row{display:flex;justify-content:space-between;gap:5px;padding:4px 0;border-top:1px solid #f4f0e8}.meal-row:first-child{border:0}.meal-row.link{color:var(--green);font-weight:600;cursor:pointer}.meal-row b{font-weight:500}.meal-row em{font-style:normal;color:var(--muted);white-space:nowrap}
.photo{height:126px;background:linear-gradient(145deg,#ffe9c8,#f6dfbd);display:grid;place-items:center;font-size:50px}.recipe-card .info{padding:10px 11px 13px}.recipe-card .name{font-weight:700;font-size:14px}.recipe-card small{color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:center;position:relative;padding:calc(16px + env(safe-area-inset-top)) 16px 12px;font-weight:800;font-size:18px}.back{position:absolute;left:14px;border:0;background:none;font-size:27px;color:var(--ink)}.top-heart{position:absolute;right:15px;border:0;background:none;font-size:25px;color:#aaa}.top-heart.on{color:var(--red)}
.hero{margin:0 16px;height:230px;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#ffe7be,#f1d9b6);display:grid;place-items:center;font-size:75px}.hero img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}.detail{padding:18px}.detail h2{margin:0;font-size:24px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:15px}.panel h3{margin:0 0 10px;font-size:16px}.ingredient,.step,.cart-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid #f2eee7}.ingredient:first-of-type,.step:first-of-type,.cart-row:first-of-type{border-top:0}.ingredient label,.step label,.cart-row label{flex:1}.buy{border:0;background:#fff0e8;color:var(--orange);border-radius:10px;padding:6px 9px;font-size:12px;font-weight:700;text-decoration:none}.check{width:21px;height:21px;accent-color:var(--green)}.primary{width:100%;border:0;border-radius:15px;background:var(--green);color:#fff;padding:14px;font-weight:700;font-size:16px;margin-top:14px}.tip{background:var(--cream);border-radius:14px;padding:12px;margin-top:12px;font-size:13px}
.cook-head{text-align:center;padding:20px 16px 8px}.cook-head b{font-size:20px}.cook-photo{height:190px;margin:8px 16px 18px;border-radius:20px;overflow:hidden;background:#ffe8c4;display:grid;place-items:center;font-size:65px}.steps{padding:0 16px}.step{background:#fff;border:1px solid var(--line);border-radius:16px!important;margin-bottom:9px;padding:14px}.step.done{opacity:.55;text-decoration:line-through}.step-num{width:28px;height:28px;border-radius:50%;background:var(--green2);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:12px}
.cart{padding:0 16px 30px}.cart-summary{background:var(--green);color:white;border-radius:20px;padding:18px;margin-bottom:14px}.cart-summary b{font-size:21px}.cart-row{background:#fff;padding:12px;border-bottom:1px solid var(--line)}.cart-row:first-of-type{border-radius:16px 16px 0 0}.cart-row:last-of-type{border-radius:0 0 16px 16px;border-bottom:0}.empty{text-align:center;color:var(--muted);padding:70px 20px}.empty .ico{font-size:55px}
.pills{display:flex;gap:8px;padding:0 16px 15px;overflow:auto}.pill{white-space:nowrap;border:0;background:#f0eee8;padding:8px 14px;border-radius:99px;color:#657168}.pill.on{background:var(--green);color:white}
.my-tabs{display:flex;margin:0 16px 14px;background:#f0eee8;border-radius:14px;padding:4px}.my-tabs button{flex:1;border:0;background:none;padding:9px;border-radius:11px;color:#667269}.my-tabs button.on{background:white;color:var(--green);font-weight:700;box-shadow:0 2px 8px #ddd}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.bottom a{text-decoration:none;color:#8b938d;text-align:center;padding:8px 2px 4px;font-size:11px}.bottom i{display:block;font-style:normal;font-size:23px;line-height:28px}.bottom a.on{color:var(--green);font-weight:700}
.notice{font-size:11px;color:var(--muted);padding:8px 18px 22px}@media(min-width:521px){body{padding-top:12px}.app{box-shadow:0 0 40px rgba(0,0,0,.08)}}
</style>
</head><body><main class="app" id="app"></main>
<script>
const API='https://toddler-food.dltpcjsrnr.workers.dev';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let M=[],P=[],query='',myMode='meal';
const store={get(k,d=[]){try{return JSON.parse(localStorage.getItem('yamyam_'+k))??d}catch{return d}},set(k,v){localStorage.setItem('yamyam_'+k,JSON.stringify(v))}};
const fav=(type,id)=>store.get('fav_'+type).includes(Number(id));
function toggleFav(type,id){let a=store.get('fav_'+type),n=Number(id);a=a.includes(n)?a.filter(x=>x!==n):[...a,n];store.set('fav_'+type,a);route()}
function menu(id){return M.find(x=>x.id==id)}
function photo(m,cls=''){return m&&m.ph?'<img src="'+API+'/photo?id='+m.id+'&v='+m.ph+'" alt="'+esc(m.name)+'" loading="lazy">':'<span class="'+cls+'">🍽️</span>'}
function nav(on){return '<nav class="bottom">'+[['meal','#/','🍱','식단'],['recipe','#/recipes','📖','레시피'],['cart','#/cart','🛒','장바구니'],['my','#/my','👤','MY']].map(x=>'<a class="'+(on==x[0]?'on':'')+'" href="'+x[1]+'"><i>'+x[2]+'</i>'+x[3]+'</a>').join('')+'</nav>'}
function brand(sub){return '<header><div class="brand"><div class="logo">👶</div><div><h1>얌얌쑥쑥 🌱</h1><p>'+sub+'</p></div></div></header>'}
async function load(){app.innerHTML=brand('맛있는 식단을 준비하고 있어요');try{M=await(await fetch(API+'/menus')).json()}catch{};if(!M.length)try{M=await(await fetch('menus.json')).json()}catch{};try{P=await(await fetch(API+'/plans')).json()}catch{};if(!P.length)try{P=await(await fetch('plans.json')).json()}catch{};route()}
function mealCard(p){let linked=p.items.find(x=>x.r),m=linked&&menu(linked.r);return '<article class="meal-card"><button class="heart '+(fav('meal',p.id)?'on':'')+'" onclick="toggleFav(\'meal\','+p.id+')">♥</button><div onclick="location.hash=\'#/meal/'+p.id+'\'"><div class="meal-title">식단 '+p.id+'</div><div class="total">'+esc(p.total)+'</div><div class="meal-visual">'+photo(m)+'</div></div><div class="meal-items">'+p.items.map(t=>'<div class="meal-row '+(t.r?'link':'')+'" '+(t.r?'onclick="location.hash=\'#/recipe/'+t.r+'\'"':'')+'><b>'+esc(t.n)+'</b><em>'+esc(t.g)+'</em></div>').join('')+'</div></article>'}
function meals(){app.innerHTML=brand('우리 아이의 건강한 한 끼')+'<div class="search">🔎<input id="q" placeholder="식단이나 메뉴를 검색해보세요" value="'+esc(query)+'"></div><div class="section-head"><h2>전체 식단</h2><span>'+P.length+'개의 식단</span></div><div class="grid" id="mealGrid"></div>'+nav('meal');renderMealGrid();q.oninput=e=>{query=e.target.value;renderMealGrid()}}
function renderMealGrid(){let q=query.trim().toLowerCase(),list=P.filter(p=>!q||('식단 '+p.id+' '+p.items.map(x=>x.n).join(' ')).toLowerCase().includes(q));mealGrid.innerHTML=list.map(mealCard).join('')||'<div class="empty" style="grid-column:1/-1">검색 결과가 없어요.</div>'}
function mealDetail(id){let p=P.find(x=>x.id==id);if(!p)return meals();let linked=p.items.find(x=>x.r),m=linked&&menu(linked.r);app.innerHTML='<div class="topbar"><button class="back" onclick="history.back()">‹</button>식단 '+p.id+'<button class="top-heart '+(fav('meal',p.id)?'on':'')+'" onclick="toggleFav(\'meal\','+p.id+')">♥</button></div><div class="hero">'+photo(m)+'</div><div class="detail"><h2>식단 '+p.id+'</h2><div class="total">총 섭취량 '+esc(p.total)+'</div><div class="panel"><h3>식단 구성</h3>'+p.items.map(t=>'<div class="ingredient"><label>'+esc(t.n)+'</label><b>'+esc(t.g)+'</b>'+(t.r?'<button class="buy" onclick="location.hash=\'#/recipe/'+t.r+'\'">레시피 ›</button>':'')+'</div>').join('')+'</div></div>'+nav('meal')}
function recipeCard(m){return '<article class="recipe-card"><button class="heart '+(fav('recipe',m.id)?'on':'')+'" onclick="event.stopPropagation();toggleFav(\'recipe\','+m.id+')">♥</button><div onclick="location.hash=\'#/recipe/'+m.id+'\'"><div class="photo">'+photo(m)+'</div><div class="info"><div class="name">'+esc(m.name)+'</div><small>1회 '+esc(m.serve)+'</small></div></div></article>'}
function recipes(){app.innerHTML=brand('쉽게 찾고 바로 요리해요')+'<div class="search">🔎<input id="q" placeholder="메뉴명이나 재료를 검색해보세요" value="'+esc(query)+'"></div><div class="pills"><button class="pill on">전체</button><button class="pill">밥·죽</button><button class="pill">반찬</button><button class="pill">간식</button></div><div class="grid" id="recipeGrid"></div>'+nav('recipe');renderRecipes();q.oninput=e=>{query=e.target.value;renderRecipes()}}
function renderRecipes(){let q=query.trim().toLowerCase(),list=M.filter(m=>!q||(m.name+' '+m.ing.join(' ')).toLowerCase().includes(q));recipeGrid.innerHTML=list.map(recipeCard).join('')||'<div class="empty" style="grid-column:1/-1">검색 결과가 없어요.</div>'}
function cleanIng(s){return s.replace(/\s*\d+(?:\.\d+)?\s*(?:g|ml|개|장|작은술|큰술).*$/i,'').replace(/\s*\(.*\)$/,'').trim()}
function recipeDetail(id){let m=menu(id);if(!m)return recipes();let cart=store.get('cart');app.innerHTML='<div class="topbar"><button class="back" onclick="history.back()">‹</button>레시피<button class="top-heart '+(fav('recipe',id)?'on':'')+'" onclick="toggleFav(\'recipe\','+id+')">♥</button></div><div class="hero">'+photo(m)+'</div><div class="detail"><h2>'+esc(m.name)+'</h2><p class="sub">1회 제공량 '+esc(m.serve)+' · 대표 사진 1장</p><div class="panel"><h3>재료 (3회분)</h3>'+m.ing.map((i,k)=>{let key=m.id+'_'+k;return '<div class="ingredient"><label>'+esc(i)+'</label><button class="buy" onclick="toggleCart(\''+key+'\');this.textContent=store.get(\'cart\').includes(\''+key+'\')?\'✓ 담김\':\'🛒 담기\'">'+(cart.includes(key)?'✓ 담김':'🛒 담기')+'</button></div>'}).join('')+'</div>'+(m.tip?'<div class="tip">💡 '+esc(m.tip)+'</div>':'')+'<button class="primary" onclick="location.hash=\'#/cook/'+m.id+'\'">👨‍🍳 요리 시작하기</button></div>'+nav('recipe')}
function toggleCart(key){let a=store.get('cart');a=a.includes(key)?a.filter(x=>x!==key):[...a,key];store.set('cart',a)}
function cook(id){let m=menu(id);if(!m)return;let done=store.get('cook_'+id);app.innerHTML='<div class="topbar"><button class="back" onclick="history.back()">×</button>요리 모드</div><div class="cook-head"><b>'+esc(m.name)+'</b><div class="sub">단계별 사진 없이 대표 사진과 체크리스트로 진행해요</div></div><div class="cook-photo">'+photo(m)+'</div><div class="steps">'+m.steps.map((s,i)=>'<div class="step '+(done.includes(i)?'done':'')+'"><div class="step-num">'+(i+1)+'</div><input class="check" type="checkbox" '+(done.includes(i)?'checked':'')+' onchange="toggleStep('+id+','+i+')"><label>'+esc(s)+'</label></div>').join('')+'</div>'}
function toggleStep(id,i){let a=store.get('cook_'+id);a=a.includes(i)?a.filter(x=>x!==i):[...a,i];store.set('cook_'+id,a);cook(id)}
function cart(){let keys=store.get('cart'),done=store.get('cart_done'),groups={};keys.forEach(k=>{let [id,idx]=k.split('_').map(Number),m=menu(id);if(!m||!m.ing[idx])return;let text=m.ing[idx],name=cleanIng(text),mt=text.match(/([\d.]+)\s*(g|kg|ml|mL)$/),qty=mt?parseFloat(mt[1]):null,unit=mt?mt[2]:'';if(!groups[name])groups[name]={name,keys:[],parts:[],qty:0,unit,link:(m.links&& (m.links[text]||m.links[name]))||''};let g=groups[name];g.keys.push(k);g.parts.push(text);if(qty!==null&&(!g.unit||g.unit===unit)){g.qty+=qty;g.unit=unit}else if(qty!==null)g.mixed=true;if(!g.link&&m.links)g.link=m.links[text]||m.links[name]||''});let rows=Object.values(groups);app.innerHTML=brand('필요한 재료만 모아보세요')+'<div class="cart">'+(rows.length?'<div class="cart-summary"><div>장바구니</div><b>'+rows.length+'개 재료</b></div>'+rows.map((r,i)=>{let label=r.name+(r.qty&&!r.mixed?' '+r.qty+r.unit:' ('+r.parts.map(x=>x.replace(r.name,'').trim()).join(' + ')+')'),checked=r.keys.every(k=>done.includes(k)),href=r.link||'https://www.coupang.com/np/search?q='+encodeURIComponent(r.name);return '<div class="cart-row '+(checked?'done':'')+'"><input class="check" type="checkbox" '+(checked?'checked':'')+' onchange="toggleCartGroup('+i+')"><label>'+esc(label)+'</label><a class="buy" href="'+esc(href)+'" target="_blank" rel="noopener">구매</a><button class="buy" onclick="removeCartGroup('+i+')">삭제</button></div>'}).join('')+'<p class="notice">같은 재료는 자동으로 합쳐서 보여줘요. 체크는 구매 완료 표시이며 삭제 버튼을 눌러야 장바구니에서 지워집니다.</p>':'<div class="empty"><div class="ico">🛒</div><b>장바구니가 비어 있어요</b><p>레시피에서 필요한 재료를 담아보세요.</p></div>')+'</div>'+nav('cart');window._cartGroups=rows}
function toggleCartGroup(i){let r=window._cartGroups[i],d=store.get('cart_done'),all=r.keys.every(k=>d.includes(k));r.keys.forEach(k=>{d=d.filter(x=>x!==k);if(!all)d.push(k)});store.set('cart_done',d);cart()}
function removeCartGroup(i){let r=window._cartGroups[i],a=store.get('cart').filter(k=>!r.keys.includes(k)),d=store.get('cart_done').filter(k=>!r.keys.includes(k));store.set('cart',a);store.set('cart_done',d);cart()}
function toggleCartDone(key){let a=store.get('cart_done');a=a.includes(key)?a.filter(x=>x!==key):[...a,key];store.set('cart_done',a);cart()}
function removeCart(key){let a=store.get('cart').filter(x=>x!==key);store.set('cart',a);let d=store.get('cart_done').filter(x=>x!==key);store.set('cart_done',d);cart()}
function my(){let fm=store.get('fav_meal'),fr=store.get('fav_recipe');app.innerHTML=brand('내가 저장한 얌얌 리스트')+'<div class="my-tabs"><button class="'+(myMode=='meal'?'on':'')+'" onclick="myMode=\'meal\';my()">♥ 즐겨찾는 식단</button><button class="'+(myMode=='recipe'?'on':'')+'" onclick="myMode=\'recipe\';my()">♥ 즐겨찾는 레시피</button></div>'+(myMode=='meal'?'<div class="grid">'+P.filter(p=>fm.includes(p.id)).map(mealCard).join('')+'</div>':'<div class="grid">'+M.filter(m=>fr.includes(m.id)).map(recipeCard).join('')+'</div>')+((myMode=='meal'&&!fm.length)||(myMode=='recipe'&&!fr.length)?'<div class="empty"><div class="ico">♡</div><b>아직 저장한 항목이 없어요</b><p>마음에 드는 메뉴의 하트를 눌러보세요.</p></div>':'')+nav('my')}
function route(){let h=location.hash.replace(/^#\//,'');let [a,id]=h.split('/');if(a=='recipes')recipes();else if(a=='recipe')recipeDetail(Number(id));else if(a=='meal')mealDetail(Number(id));else if(a=='cook')cook(Number(id));else if(a=='cart')cart();else if(a=='my')my();else meals();scrollTo(0,0)}
addEventListener('hashchange',route);load();
</script></body></html>
