<style>
:root{--bg:#fffaf2;--card:#fff;--ink:#26342b;--muted:#849087;--green:#438a59;--green2:#e8f3e9;--orange:#ff7b50;--cream:#fff1dc;--line:#eee9df;--red:#ef5350;--shadow:0 8px 24px rgba(70,80,65,.08)}
*{box-sizing:border-box}html{background:#eee}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",sans-serif;min-height:100vh;padding-bottom:calc(82px + env(safe-area-inset-bottom))}

header{padding:calc(20px + env(safe-area-inset-top)) 18px 10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:16px;background:#eef7e9;display:grid;place-items:center}.logo svg{width:37px;height:37px}.brand h1{margin:0;color:#247340;font-size:25px;letter-spacing:-1.2px}.brand p{margin:0;color:var(--muted);font-size:12px}.share{margin-left:auto;width:40px;height:40px;border:0;border-radius:13px;background:#fff;color:#53635a;font-size:20px;box-shadow:0 2px 10px rgba(70,80,65,.08)}
.search{margin:10px 18px 14px;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;padding:0 13px}.search input{border:0;outline:0;background:transparent;width:100%;padding:13px 8px;color:var(--ink)}
.week-maker{margin:8px 14px 16px;padding:17px;background:linear-gradient(135deg,#edf7e8,#fff7e6);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.week-maker h3{margin:0 0 4px;font-size:18px}.week-maker p{margin:0 0 12px;font-size:12px;color:var(--muted)}.week-maker button{width:100%;border:0;border-radius:14px;background:var(--green);color:#fff;padding:12px;font-weight:800}.week-options{display:flex;gap:7px;margin:12px 0}.week-options button{background:#fff;color:var(--ink);border:1px solid var(--line);padding:9px}.week-options button.on{background:var(--green);color:#fff}.week-plan{padding:0 14px 24px}.week-day{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;margin:9px 0}.week-day h4{margin:0 0 8px;color:var(--green)}.week-slot{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #f1ede5}.week-slot:first-of-type{border:0}.week-slot span{width:34px;font-size:11px;color:var(--muted)}.week-slot b{flex:1;font-size:13px}.week-slot button{border:0;background:#f2f6ef;border-radius:9px;padding:6px 8px}.week-actions{display:flex;gap:8px;margin:14px 0}.week-actions button{flex:1;border:0;border-radius:13px;padding:11px;font-weight:700}.week-actions .main{background:var(--green);color:#fff}.section-head{display:flex;align-items:end;justify-content:space-between;padding:2px 18px 10px}.section-head h2{font-size:20px;margin:0}.section-head span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 24px}.meal-card,.recipe-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.meal-card{padding:14px}.meal-title{font-weight:800;font-size:16px}.total{font-size:22px;color:var(--green);font-weight:800;margin:2px 0 10px}.heart{position:absolute;right:10px;top:10px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.94);font-size:21px;color:#a7aea9;z-index:2}.heart.on{color:var(--red)}
.meal-visual{height:112px;border-radius:15px;background:linear-gradient(145deg,#fff2d9,#f4ead8);display:grid;place-items:center;margin-bottom:9px;font-size:54px;overflow:hidden}.meal-visual img,.photo img{width:100%;height:100%;object-fit:cover;object-position:center center}.meal-items{font-size:12px}.meal-row{display:flex;justify-content:space-between;gap:5px;padding:4px 0;border-top:1px solid #f4f0e8}.meal-row:first-child{border:0}.meal-row.link{color:var(--green);font-weight:600;cursor:pointer}.meal-row b{font-weight:500}.meal-row em{font-style:normal;color:var(--muted);white-space:nowrap}
.photo{height:126px;background:linear-gradient(145deg,#ffe9c8,#f6dfbd);display:block;overflow:hidden;position:relative;font-size:50px}.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}.recipe-card .info{position:relative;z-index:1;background:#fff;padding:10px 11px 13px}.recipe-card .name{font-weight:700;font-size:14px}.recipe-card small{color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:center;position:relative;padding:calc(16px + env(safe-area-inset-top)) 16px 12px;font-weight:800;font-size:18px}.back{position:absolute;left:14px;border:0;background:none;font-size:27px;color:var(--ink)}.top-heart{position:absolute;right:15px;border:0;background:none;font-size:25px;color:#aaa}.top-heart.on{color:var(--red)}.detail-share{position:absolute;right:58px;border:0;background:none;font-size:22px;color:#647269;padding:5px}
.hero{margin:0 16px;height:230px;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#ffe7be,#f1d9b6);display:grid;place-items:center;font-size:75px}.hero img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}.detail{padding:18px}.detail h2{margin:0;font-size:24px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:15px}.panel h3{margin:0 0 10px;font-size:16px}.ingredient,.step,.cart-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid #f2eee7}.ingredient:first-of-type,.step:first-of-type,.cart-row:first-of-type{border-top:0}.ingredient label,.step label,.cart-row label{flex:1}.buy{border:0;background:#fff0e8;color:var(--orange);border-radius:10px;padding:6px 9px;font-size:12px;font-weight:700;text-decoration:none}.check{width:21px;height:21px;accent-color:var(--green)}.primary{width:100%;border:0;border-radius:15px;background:var(--green);color:#fff;padding:14px;font-weight:700;font-size:16px;margin-top:14px}.tip{background:var(--cream);border-radius:14px;padding:12px;margin-top:12px;font-size:13px}
.cook-head{text-align:center;padding:20px 16px 8px}.cook-head b{font-size:20px}.cook-photo{height:190px;margin:8px 16px 18px;border-radius:20px;overflow:hidden;background:#ffe8c4;display:grid;place-items:center;font-size:65px}.cook-photo img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}.steps{padding:0 16px}.step{background:#fff;border:1px solid var(--line);border-radius:16px!important;margin-bottom:9px;padding:14px}.step.done{opacity:.55;text-decoration:line-through}.step-num{width:28px;height:28px;border-radius:50%;background:var(--green2);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:12px}
.cart{padding:0 16px 30px}.cart-summary{background:var(--green);color:white;border-radius:20px;padding:18px;margin-bottom:14px}.cart-summary b{font-size:21px}.cart-row{background:#fff;padding:12px;border-bottom:1px solid var(--line)}.cart-row:first-of-type{border-radius:16px 16px 0 0}.cart-row:last-of-type{border-radius:0 0 16px 16px;border-bottom:0}.empty{text-align:center;color:var(--muted);padding:70px 20px}.empty .ico{font-size:55px}
.pills{display:flex;gap:8px;padding:0 16px 15px;overflow:auto}.pill{white-space:nowrap;border:0;background:#f0eee8;padding:8px 14px;border-radius:99px;color:#657168}.pill.on{background:var(--green);color:white}
.my-tabs{display:flex;margin:0 16px 14px;background:#f0eee8;border-radius:14px;padding:4px}.my-tabs button{flex:1;border:0;background:none;padding:9px;border-radius:11px;color:#667269}.my-tabs button.on{background:white;color:var(--green);font-weight:700;box-shadow:0 2px 8px #ddd}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.bottom a{text-decoration:none;color:#8b938d;text-align:center;padding:7px 5px 4px;font-size:11px;position:relative}.bottom i{display:grid;place-items:center;height:30px}.bottom svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.bottom a.on{color:#278b4b;font-weight:800;background:#eef8ef;border-radius:18px;margin:5px 6px}.bottom a.on i:after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:#278b4b}
.notice{font-size:11px;color:var(--muted);padding:8px 18px 22px}.update-note{margin:0 18px 14px;padding:10px 12px;background:#f0f7ed;border-radius:13px;color:#5f7165;font-size:12px}.new-badge{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:8px;background:#ff735c;color:white;font-size:9px;font-weight:800;vertical-align:2px}.partner-notice{font-size:11px;color:#777;padding:13px 15px;margin:12px 0;background:#fff7ef;border-radius:13px;line-height:1.55}.install-banner{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(488px,calc(100% - 24px));z-index:40;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 13px;box-shadow:0 10px 30px rgba(50,70,55,.18);display:flex;align-items:center;gap:10px}.install-banner .sprout{width:42px;height:42px;border-radius:13px;background:#eef7e9;display:grid;place-items:center;font-size:22px}.install-banner .copy{flex:1}.install-banner b{display:block;font-size:13px}.install-banner small{color:var(--muted);font-size:11px}.install-banner button,.install-card button{border:0;border-radius:11px;background:var(--green);color:#fff;padding:9px 11px;font-weight:700;font-size:12px}.install-banner .later{background:none;color:var(--muted);padding:5px}.install-card{margin:4px 16px 18px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}.install-card .copy{flex:1}.install-card b{font-size:14px}.install-card p{font-size:11px;color:var(--muted);margin:3px 0 0}.install-modal{position:fixed;inset:0;z-index:60;background:rgba(30,40,34,.45);display:grid;place-items:end center;padding:18px}.install-sheet{width:min(500px,100%);background:#fff;border-radius:24px;padding:22px 18px calc(22px + env(safe-area-inset-bottom));text-align:center}.install-sheet h3{margin:4px 0 8px}.install-sheet p{font-size:13px;color:#647269;line-height:1.65}.install-sheet .steps{text-align:left;background:#f5f8f3;border-radius:15px;padding:12px 14px;margin:14px 0}.install-sheet button{width:100%;border:0;border-radius:14px;padding:13px;background:var(--green);color:#fff;font-weight:700}@media(min-width:521px){body{padding-top:12px}.app{box-shadow:0 0 40px rgba(0,0,0,.08)}}

</head><body><main class="app" id="app"></main>
<script>
const API='https://toddler-food.dltpcjsrnr.workers.dev';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let M=[],P=[],query='',myMode='meal',deferredInstall=null;const NEW_DAYS=14;function isNew(x){if(!x||!x.addedAt)return false;let t=new Date(x.addedAt).getTime();return Number.isFinite(t)&&Date.now()-t<NEW_DAYS*86400000}function newBadge(x){return isNew(x)?'<span class="new-badge">NEW</span>':''}
const store={get(k,d=[]){try{return JSON.parse(localStorage.getItem('yamyam_'+k))??d}catch{return d}},set(k,v){localStorage.setItem('yamyam_'+k,JSON.stringify(v))}};
const fav=(type,id)=>store.get('fav_'+type).includes(Number(id));
function toggleFav(type,id){let a=store.get('fav_'+type),n=Number(id);a=a.includes(n)?a.filter(x=>x!==n):[...a,n];store.set('fav_'+type,a);route()}
function menu(id){return M.find(x=>x.id==id)}
function photo(m,cls=''){return m&&m.ph?'<img src="'+API+'/photo?id='+m.id+'&v='+m.ph+'" alt="'+esc(m.name)+'" loading="lazy">':'<span class="'+cls+'">🍽️</span>'}
const icons={meal:'<svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>',recipe:'<svg viewBox="0 0 24 24"><path d="M4 5.5c3-1.5 5.7-1.2 8 1v13c-2.3-2.2-5-2.5-8-1zM20 5.5c-3-1.5-5.7-1.2-8 1v13c2.3-2.2 5-2.5 8-1z"/></svg>',cart:'<svg viewBox="0 0 24 24"><path d="M3 4h2l2 11h10l2-8H6"/><circle cx="9" cy="19" r="1"/><circle cx="17" cy="19" r="1"/></svg>',my:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21c.5-4 3-6 7-6s6.5 2 7 6"/></svg>'};
function nav(on){return '<nav class="bottom">'+[['meal','#/','식단'],['recipe','#/recipes','레시피'],['cart','#/cart','장바구니'],['my','#/my','MY']].map(x=>'<a class="'+(on==x[0]?'on':'')+'" href="'+x[1]+'"><i>'+icons[x[0]]+'</i>'+x[2]+'</a>').join('')+'</nav>'}
function brand(sub){return '<header><div class="brand"><div class="logo"><svg viewBox="0 0 48 48"><path d="M24 41V23" stroke="#238346" stroke-width="4" stroke-linecap="round"/><path d="M23 25C11 26 8 17 9 10c8-1 16 3 16 12" fill="#78b94b" stroke="#238346" stroke-width="2"/><path d="M25 25c12 1 15-8 14-15-8-1-16 3-16 12" fill="#78b94b" stroke="#238346" stroke-width="2"/><path d="M16 7l-2-4M24 6V2M32 7l2-4" stroke="#f5aa22" stroke-width="3" stroke-linecap="round"/></svg></div><div><h1>얌얌쑥쑥</h1><p>'+sub+'</p></div><button class="share" onclick="shareApp()" aria-label="공유하기">↗</button></div></header>'}
function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}function installLabel(){return isIOS()?'홈 화면에 추가':'앱 설치'}function installUI(){if(isStandalone())return '';return '<div class="install-card"><div class="sprout">🌱</div><div class="copy"><b>얌얌쑥쑥을 앱처럼 사용하세요</b><p>홈 화면에서 바로 열 수 있어요.</p></div><button onclick="startInstall()">'+installLabel()+'</button></div>'}function maybeInstallBanner(){if(isStandalone()||sessionStorage.getItem('yamyam_install_later'))return;setTimeout(()=>{if(document.querySelector('.install-banner'))return;document.body.insertAdjacentHTML('beforeend','<div class="install-banner"><div class="sprout">🌱</div><div class="copy"><b>얌얌쑥쑥을 앱처럼 사용해보세요</b><small>홈 화면에서 더 빠르고 편하게</small></div><button onclick="startInstall()">'+installLabel()+'</button><button class="later" onclick="dismissInstall()">×</button></div>')},900)}function dismissInstall(){sessionStorage.setItem('yamyam_install_later','1');document.querySelector('.install-banner')?.remove()}async function startInstall(){if(isStandalone())return;if(isIOS()){document.body.insertAdjacentHTML('beforeend','<div class="install-modal" onclick="if(event.target===this)this.remove()"><div class="install-sheet"><div style="font-size:34px">🌱</div><h3>홈 화면에 얌얌쑥쑥 추가하기</h3><p>아이폰에서는 Safari의 홈 화면 추가 기능을 이용해요.</p><div class="steps"><b>1.</b> Safari 아래쪽의 <b>공유 ⬆</b> 버튼을 누르세요.<br><b>2.</b> 메뉴에서 <b>홈 화면에 추가</b>를 선택하세요.<br><b>3.</b> 오른쪽 위의 <b>추가</b>를 누르면 완료!</div><button onclick="this.closest(\'.install-modal\').remove()">확인했어요</button></div></div>');dismissInstall();return}if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;dismissInstall();return}alert('브라우저 메뉴에서 ‘앱 설치’ 또는 ‘홈 화면에 추가’를 선택해주세요.')}addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;maybeInstallBanner()});addEventListener('appinstalled',()=>{deferredInstall=null;document.querySelector('.install-banner')?.remove()});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
async function shareApp(title='얌얌쑥쑥',text='우리 아이의 건강한 한 끼 🌱'){const d={title,text,url:location.href};try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(location.href);alert('링크를 복사했어요.')}}catch(e){}}
async function countVisit(){try{const k='yamyam_visit_day',today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date());if(localStorage.getItem(k)===today)return;const r=await fetch(API+'/stats/visit',{method:'POST'});if(r.ok)localStorage.setItem(k,today)}catch{}}
async function load(){countVisit();app.innerHTML=brand('맛있는 식단을 준비하고 있어요');try{M=await(await fetch(API+'/menus')).json()}catch{};if(!M.length)try{M=await(await fetch('menus.json')).json()}catch{};try{P=await(await fetch(API+'/plans')).json()}catch{};if(!P.length)try{P=await(await fetch('plans.json')).json()}catch{};route()}
function planPhoto(p,fallback){return p&&p.ph?'<img src="'+API+'/photo?id=plan-'+p.id+'&v='+p.ph+'" alt="" onerror="this.outerHTML=\''+photo(fallback).replace(/'/g,"&#39;")+'\'">':photo(fallback)}
function mealNo(p){let i=P.indexOf(p);return i>=0?i+1:''}
function mealCard(p){let linked=p.items.find(x=>x.r),m=linked&&menu(linked.r);return '<article class="meal-card"><button class="heart '+(fav('meal',p.id)?'on':'')+'" onclick="toggleFav(\'meal\','+p.id+')">♥</button><div onclick="location.hash=\'#/meal/'+p.id+'\'"><div class="meal-title">식단 '+mealNo(p)+newBadge(p)+'</div><div class="total">'+esc(p.total)+'</div><div class="meal-visual">'+planPhoto(p,m)+'</div></div><div class="meal-items">'+p.items.map(t=>'<div class="meal-row '+(t.r?'link':'')+'" '+(t.r?'onclick="location.hash=\'#/recipe/'+t.r+'\'"':'')+'><b>'+esc(t.n)+'</b><em>'+esc(t.g)+'</em></div>').join('')+'</div></article>'}
let weekMeals=2,weekRepeat=2,weekPlan=[];function weekMaker(){return '<div class="week-maker"><h3>🌱 이번 주 뭐 먹지?</h3><p>한 번 만든 식단을 적당히 반복해서 현실적인 7일 식단을 만들어요.</p><button onclick="location.hash=\'#/week\'">7일 식단 만들기</button></div>'}function meals(){app.innerHTML=brand('우리 아이의 건강한 한 끼')+weekMaker()+'<div class="search">🔎<input id="q" placeholder="식단이나 메뉴를 검색해보세요" value="'+esc(query)+'"></div><div class="section-head"><h2>전체 식단</h2><span>'+P.length+'개의 식단</span></div><div class="grid" id="mealGrid"></div>'+nav('meal');renderMealGrid();q.oninput=e=>{query=e.target.value;renderMealGrid()}}
function renderMealGrid(){let q=query.trim().toLowerCase(),list=P.filter(p=>!q||('식단 '+p.id+' '+p.items.map(x=>x.n).join(' ')).toLowerCase().includes(q));mealGrid.innerHTML=list.map(mealCard).join('')||'<div class="empty" style="grid-column:1/-1">검색 결과가 없어요.</div>'}
function makeWeek(){if(!P.length)return;let slots=7*weekMeals,pool=[],src=[...P].sort(()=>Math.random()-.5);while(pool.length<slots){for(const p of src){for(let k=0;k<weekRepeat&&pool.length<slots;k++)pool.push(p)}src=[...P].sort(()=>Math.random()-.5)}weekPlan=pool.sort(()=>Math.random()-.5);renderWeek()}function swapWeek(i){let choices=P.filter(p=>p.id!==weekPlan[i]?.id);if(choices.length){weekPlan[i]=choices[Math.floor(Math.random()*choices.length)];renderWeek()}}function renderWeek(){let names=weekMeals==1?['한 끼']:weekMeals==2?['점심','저녁']:['아침','점심','저녁'];let html='';for(let d=0;d<7;d++){html+='<div class="week-day"><h4>'+['월','화','수','목','금','토','일'][d]+'요일</h4>';for(let s=0;s<weekMeals;s++){let i=d*weekMeals+s,p=weekPlan[i];html+='<div class="week-slot"><span>'+names[s]+'</span><b>'+(p?'식단 '+mealNo(p)+' · '+p.items.map(x=>esc(x.n)).join(', '):'-')+'</b><button onclick="swapWeek('+i+')">↻</button></div>'}html+='</div>'}document.querySelector('#weekResult').innerHTML=html+'<div class="week-actions"><button onclick="makeWeek()">전체 다시 만들기</button><button class="main" onclick="saveWeek()">이번 주 식단 저장</button></div>'}function saveWeek(){store.set('week_plan',weekPlan.map(p=>p.id));store.set('week_meals',[weekMeals]);alert('이번 주 식단을 저장했어요.')}function week(){app.innerHTML='<div class="topbar"><button class="back" onclick="history.back()">‹</button>이번 주 식단</div><div class="detail"><h2>7일 식단 만들기</h2><p class="sub">하루 끼니 수와 반복 정도를 선택해보세요.</p><div class="panel"><h3>하루 몇 끼 먹나요?</h3><div class="week-options">'+[1,2,3].map(n=>'<button class="'+(weekMeals==n?'on':'')+'" onclick="weekMeals='+n+';week()"> '+n+'끼 </button>').join('')+'</div><h3>한 식단을 몇 끼 활용할까요?</h3><div class="week-options">'+[1,2,3].map(n=>'<button class="'+(weekRepeat==n?'on':'')+'" onclick="weekRepeat='+n+';week()"> '+n+'끼'+(n==2?' ⭐':'')+' </button>').join('')+'</div><button class="primary" onclick="makeWeek()">🌱 7일 식단 만들기</button></div></div><div class="week-plan" id="weekResult"></div>'+nav('meal');if(weekPlan.length)renderWeek()}
function mealDetail(id){let p=P.find(x=>x.id==id);if(!p)return meals();let linked=p.items.find(x=>x.r),m=linked&&menu(linked.r);app.innerHTML='<div class="topbar"><button class="back" onclick="history.back()">‹</button>식단 '+mealNo(p)+'<button class="detail-share" onclick="shareApp(\'얌얌쑥쑥 | 식단 '+mealNo(p)+'\',\'우리 아이의 건강한 한 끼 🌱 · 식단 '+mealNo(p)+'\')" aria-label="공유하기">↗</button><button class="top-heart '+(fav('meal',p.id)?'on':'')+'" onclick="toggleFav(\'meal\','+p.id+')">♥</button></div><div class="hero">'+planPhoto(p,m)+'</div><div class="detail"><h2>식단 '+mealNo(p)+'</h2><div class="total">총 섭취량 '+esc(p.total)+'</div><div class="panel"><h3>식단 구성</h3>'+p.items.map(t=>'<div class="ingredient"><label>'+esc(t.n)+'</label><b>'+esc(t.g)+'</b>'+(t.r?'<button class="buy" onclick="location.hash=\'#/recipe/'+t.r+'\'">레시피 ›</button>':'')+'</div>').join('')+'</div></div>'+nav('meal')}
function recipeCard(m){return '<article class="recipe-card"><button class="heart '+(fav('recipe',m.id)?'on':'')+'" onclick="event.stopPropagation();toggleFav(\'recipe\','+m.id+')">♥</button><div onclick="location.hash=\'#/recipe/'+m.id+'\'"><div class="photo">'+photo(m)+'</div><div class="info"><div class="name">'+esc(m.name)+'</div><small>1회 '+esc(m.serve)+'</small></div></div></article>'}
function recipes(){app.innerHTML=brand('쉽게 찾고 바로 요리해요')+'<div class="search">🔎<input id="q" placeholder="메뉴명이나 재료를 검색해보세요" value="'+esc(query)+'"></div><div class="grid" id="recipeGrid"></div>'+nav('recipe');renderRecipes();q.oninput=e=>{query=e.target.value;renderRecipes()}}
function renderRecipes(){let q=query.trim().toLowerCase(),list=M.filter(m=>!q||(m.name+' '+m.ing.join(' ')).toLowerCase().includes(q));recipeGrid.innerHTML=list.map(recipeCard).join('')||'<div class="empty" style="grid-column:1/-1">검색 결과가 없어요.</div>'}
function cleanIng(s){return s.replace(/\s*\d+(?:\.\d+)?\s*(?:g|ml|개|장|작은술|큰술).*$/i,'').replace(/\s*\(.*\)$/,'').trim()}
function recipeDetail(id){let m=menu(id);if(!m)return recipes();let cart=store.get('cart');app.innerHTML='<div class="topbar"><button class="back" onclick="history.back()">‹</button>레시피<button class="detail-share" onclick="shareApp(\'얌얌쑥쑥 | '+esc(m.name)+'\',\'우리 아이의 건강한 한 끼 🌱 · '+esc(m.name)+' 레시피\')" aria-label="공유하기">↗</button><button class="top-heart '+(fav('recipe',id)?'on':'')+'" onclick="toggleFav(\'recipe\','+id+')">♥</button></div><div class="hero">'+photo(m)+'</div><div class="detail"><h2>'+esc(m.name)+'</h2><p class="sub">1회 제공량 '+esc(m.serve)+' · 대표 사진 1장</p><div class="panel"><h3>재료 ('+esc(m.servings||3)+'회분)</h3>'+m.ing.map((i,k)=>{let key=m.id+'_'+k;return '<div class="ingredient"><label>'+esc(i)+'</label><button class="buy" onclick="toggleCart(\''+key+'\');this.textContent=store.get(\'cart\').includes(\''+key+'\')?\'✓ 담김\':\'🛒 담기\'">'+(cart.includes(key)?'✓ 담김':'🛒 담기')+'</button></div>'}).join('')+'</div>'+(m.tip?'<div class="tip">💡 '+esc(m.tip)+'</div>':'')+'<button class="primary" onclick="location.hash=\'#/cook/'+m.id+'\'">👨‍🍳 요리 시작하기</button></div>'+nav('recipe')}
function toggleCart(key){let a=store.get('cart');a=a.includes(key)?a.filter(x=>x!==key):[...a,key];store.set('cart',a)}
function cook(id){let m=menu(id);if(!m)return;let done=store.get('cook_'+id);app.innerHTML='<div class="topbar"><button class="back" onclick="history.back()">×</button>요리 모드</div><div class="cook-head"><b>'+esc(m.name)+'</b><div class="sub">체크리스트로 하나씩 따라 해보세요</div></div><div class="cook-photo">'+photo(m)+'</div><div class="steps">'+m.steps.map((s,i)=>'<div class="step '+(done.includes(i)?'done':'')+'"><div class="step-num">'+(i+1)+'</div><input class="check" type="checkbox" '+(done.includes(i)?'checked':'')+' onchange="toggleStep('+id+','+i+')"><label>'+esc(s)+'</label></div>').join('')+'</div><div style="padding:0 16px 28px"><button class="primary" onclick="finishCook('+id+')">요리 완료</button><p class="notice" style="text-align:center;padding:8px 0 0">완료하면 체크 기록이 초기화돼요.</p></div>'}
function finishCook(id){store.set('cook_'+id,[]);location.hash='#/recipe/'+id}
function toggleStep(id,i){let a=store.get('cook_'+id);a=a.includes(i)?a.filter(x=>x!==i):[...a,i];store.set('cook_'+id,a);cook(id)}
function cart(){let keys=store.get('cart'),done=store.get('cart_done'),groups={};keys.forEach(k=>{let [id,idx]=k.split('_').map(Number),m=menu(id);if(!m||!m.ing[idx])return;let text=m.ing[idx],name=cleanIng(text),mt=text.match(/([\d.]+)\s*(g|kg|ml|mL)$/),qty=mt?parseFloat(mt[1]):null,unit=mt?mt[2]:'';if(!groups[name])groups[name]={name,keys:[],parts:[],qty:0,unit,link:(m.links&& (m.links[text]||m.links[name]))||''};let g=groups[name];g.keys.push(k);g.parts.push(text);if(qty!==null&&(!g.unit||g.unit===unit)){g.qty+=qty;g.unit=unit}else if(qty!==null)g.mixed=true;if(!g.link&&m.links)g.link=m.links[text]||m.links[name]||''});let rows=Object.values(groups);app.innerHTML=brand('필요한 재료만 모아보세요')+'<div class="cart">'+(rows.length?'<div class="cart-summary"><div>장바구니</div><b>'+rows.length+'개 재료</b></div>'+rows.map((r,i)=>{let label=r.name+(r.qty&&!r.mixed?' '+r.qty+r.unit:' ('+r.parts.map(x=>x.replace(r.name,'').trim()).join(' + ')+')'),checked=r.keys.every(k=>done.includes(k)),href='#';return '<div class="cart-row '+(checked?'done':'')+'"><input class="check" type="checkbox" '+(checked?'checked':'')+' onchange="toggleCartGroup('+i+')"><label>'+esc(label)+'</label><button class="buy" onclick="openCoupang(\''+encodeURIComponent(r.name)+'\',this)">쿠팡에서 보기</button><button class="buy" onclick="removeCartGroup('+i+')">삭제</button></div>'}).join('')+'<div class="partner-notice"><b>쿠팡 파트너스 안내</b><br>이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div><p class="notice">같은 재료는 자동으로 합쳐서 보여줘요. 체크는 구매 완료 표시이며 삭제 버튼을 눌러야 장바구니에서 지워집니다.</p>':'<div class="empty"><div class="ico">🛒</div><b>장바구니가 비어 있어요</b><p>레시피에서 필요한 재료를 담아보세요.</p></div>')+'</div>'+nav('cart');window._cartGroups=rows}
async function openCoupang(q,btn){const name=decodeURIComponent(q),old=btn.textContent;btn.disabled=true;btn.textContent='연결 중…';try{const res=await fetch(API+'/coupang?q='+encodeURIComponent(name));const d=await res.json();if(!res.ok||!d.ok||!d.url)throw new Error(d.error||'link_error');window.open(d.url,'_blank','noopener')}catch(e){alert('쿠팡 연결에 실패했어요. 잠시 후 다시 시도해주세요.')}finally{btn.disabled=false;btn.textContent=old}}
function toggleCartGroup(i){let r=window._cartGroups[i],d=store.get('cart_done'),all=r.keys.every(k=>d.includes(k));r.keys.forEach(k=>{d=d.filter(x=>x!==k);if(!all)d.push(k)});store.set('cart_done',d);cart()}
function removeCartGroup(i){let r=window._cartGroups[i],a=store.get('cart').filter(k=>!r.keys.includes(k)),d=store.get('cart_done').filter(k=>!r.keys.includes(k));store.set('cart',a);store.set('cart_done',d);cart()}
function toggleCartDone(key){let a=store.get('cart_done');a=a.includes(key)?a.filter(x=>x!==key):[...a,key];store.set('cart_done',a);cart()}
function removeCart(key){let a=store.get('cart').filter(x=>x!==key);store.set('cart',a);let d=store.get('cart_done').filter(x=>x!==key);store.set('cart_done',d);cart()}
function savedWeekData(){let ids=store.get('week_plan');return Array.isArray(ids)?ids:[]}
function myWeekCard(){let saved=savedWeekData().length>0;return '<section class="week-maker"><h3>📅 나의 주간 식단</h3><p>'+(saved?'저장해 둔 월~일 식단을 다시 확인해보세요.':'아직 저장한 주간 식단이 없어요. 이번 주 식단을 만들어보세요.')+'</p><button onclick="location.hash=\''+(saved?'#/my/week':'#/week')+'\'">'+(saved?'이번 주 식단 보기':'7일 식단 만들기')+'</button></section>'}
function savedWeek(){let ids=savedWeekData();if(!ids.length){my();return}let count=Number(store.get('week_meals',[0])[0]),inferred=ids.length/7;if(![1,2,3].includes(count)||ids.length!==7*count)count=[1,2,3].includes(inferred)?inferred:2;let names=count==1?['한 끼']:count==2?['점심','저녁']:['아침','점심','저녁'];let html='';for(let d=0;d<7;d++){html+='<div class="week-day"><h4>'+['월','화','수','목','금','토','일'][d]+'요일</h4>';for(let s=0;s<count;s++){let p=P.find(p=>p.id==ids[d*count+s]);html+='<div class="week-slot"><span>'+names[s]+'</span><b>'+(p?'식단 '+mealNo(p)+' · '+p.items.map(x=>esc(x.n)).join(', '):'저장된 식단을 찾을 수 없어요')+'</b></div>'}html+='</div>'}app.innerHTML='<div class="topbar"><button class="back" onclick="location.hash=\'#/my\'" aria-label="MY로 돌아가기">‹</button>나의 주간 식단</div><div class="detail"><p class="sub">저장한 7일 식단 · 하루 '+count+'끼</p></div><div class="week-plan">'+html+'<div class="week-actions"><button class="main" onclick="location.hash=\'#/week\'">7일 식단 만들기</button></div></div>'+nav('my')}
function my(){let fm=store.get('fav_meal'),fr=store.get('fav_recipe');app.innerHTML=brand('내가 저장한 얌얌 리스트')+installUI()+myWeekCard()+'<div class="my-tabs"><button class="'+(myMode=='meal'?'on':'')+'" onclick="myMode=\'meal\';my()">♥ 즐겨찾는 식단</button><button class="'+(myMode=='recipe'?'on':'')+'" onclick="myMode=\'recipe\';my()">♥ 즐겨찾는 레시피</button></div>'+(myMode=='meal'?'<div class="grid">'+P.filter(p=>fm.includes(p.id)).map(mealCard).join('')+'</div>':'<div class="grid">'+M.filter(m=>fr.includes(m.id)).map(recipeCard).join('')+'</div>')+((myMode=='meal'&&!fm.length)||(myMode=='recipe'&&!fr.length)?'<div class="empty"><div class="ico">♡</div><b>아직 저장한 항목이 없어요</b><p>마음에 드는 메뉴의 하트를 눌러보세요.</p></div>':'')+nav('my')}
function route(){let h=location.hash.replace(/^#\//,'');let [a,id]=h.split('/');if(a=='recipes')recipes();else if(a=='recipe')recipeDetail(Number(id));else if(a=='meal')mealDetail(Number(id));else if(a=='week')week();else if(a=='cook')cook(Number(id));else if(a=='cart')cart();else if(a=='my'&&id=='week')savedWeek();else if(a=='my')my();else meals();scrollTo(0,0)}
addEventListener('hashchange',route);load();if(isIOS())maybeInstallBanner();
</script></body></html>
