<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>유아식 관리자</title>
<style>
body{margin:auto;max-width:640px;padding:16px;font:15px/1.5 sans-serif;background:#f2f7f3;color:#1f3326}
input,textarea,button{font:inherit;width:100%;padding:10px;border:1px solid #c9d8cd;border-radius:10px;background:#fff;margin:4px 0}
button{width:auto;background:#5f9473;color:#fff;border:0;cursor:pointer}
button.s{background:#fff;color:#1f3326;border:1px solid #c9d8cd}button.r{background:#b4533f}
.row small{display:block;color:#6b7d70}.row{flex-wrap:wrap;display:flex;gap:8px;align-items:center;background:#fff;border-radius:12px;padding:6px 12px;margin:6px 0}.row span{flex:1}
label{display:block;margin-top:12px;font-weight:bold}
</style></head>
<body><h2>유아식 관리자</h2><div id="a"></div>
<script>
const API='https://toddler-food.dltpcjsrnr.workers.dev'; // 워커 주소로 교체
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M=[],pw=sessionStorage.pw||'',E=null;
async function api(p,o={}){
  const r=await fetch(API+p,{...o,headers:{'x-pw':pw}});
  if(r.status==401){sessionStorage.pw=pw='';login('비밀번호가 맞지 않아요.');throw 0}
  if(!r.ok){alert('저장 실패 ('+r.status+'): 워커를 최신 코드로 배포했는지 확인해 주세요.');throw 0}
  return r;
}
function login(msg=''){$('#a').innerHTML=`<p>${msg}</p><input id="p" type="password" placeholder="관리자 비밀번호"><button onclick="go()">로그인</button>`}
async function go(){pw=$('#p').value;await api('/auth',{method:'POST'});sessionStorage.pw=pw;init()}
async function init(){M=await (await fetch(API+'/menus')).json();try{P=await (await fetch(API+'/plans')).json()}catch(e){P=[]}show()}
const save=()=>api('/menus',{method:'POST',body:JSON.stringify(M)});
function show(){
  if(tab=='p')return showP();
  $('#a').innerHTML=`${tabs()}<button onclick="edit()">+ 새 메뉴</button> ${M.length?'':'<button class="s" onclick="seed()">기본 메뉴 19개 불러오기</button>'}
  ${M.map(m=>`<div class="row"><span>${esc(m.name)}${m.ph?' 📷':''}</span><button class="s" onclick="edit(${m.id})">수정</button><button class="r" onclick="del(${m.id})">삭제</button></div>`).join('')}`;
}
async function seed(){M=await (await fetch('menus.json')).json();await save();show()}
function edit(id){
  E=M.find(x=>x.id==id)||{id:Date.now(),name:'',serve:'',ing:[],steps:[],tip:'',links:{}};
  $('#a').innerHTML=`<label>메뉴명</label><input id="n" value="${esc(E.name)}">
  <label>1회 제공량</label><input id="sv" value="${esc(E.serve)}" placeholder="예: 50g">
  <label>재료 (한 줄에 하나, 예: 소고기 다짐육 90g)</label><textarea id="ig" rows="6">${esc(E.ing.join('\n'))}</textarea>
  <label>만드는 법 (한 줄에 한 단계)</label><textarea id="st" rows="6">${esc(E.steps.join('\n'))}</textarea>
  <label>팁 (선택)</label><input id="tp" value="${esc(E.tip||'')}">
  <label>쿠팡 링크 (한 줄에 "재료명 | 주소" / 비워두면 자동 검색 링크)</label><textarea id="lk" rows="4">${esc(Object.entries(E.links||{}).map(([k,v])=>k+' | '+v).join('\n'))}</textarea>
  <label>대표사진</label><input id="f" type="file" accept="image/*">
  <button onclick="sv()">저장</button> <button class="s" onclick="show()">취소</button>`;
}
async function sv(){
  const L=s=>$(s).value.split('\n').map(x=>x.trim()).filter(Boolean);
  const name=$('#n').value.trim();if(!name)return alert('메뉴명을 입력하세요.');
  E.name=name;E.serve=$('#sv').value.trim();E.ing=L('#ig');E.steps=L('#st');E.tip=$('#tp').value.trim();E.links={};
  for(const l of L('#lk')){const[k,...v]=l.split('|'),u=v.join('|').trim();if(/^https?:\/\//.test(u))E.links[k.trim()]=u}
  const f=$('#f').files[0];
  if(f){await api('/photo?id='+E.id,{method:'POST',body:await shrink(f)});E.ph=Date.now()}
  if(!M.includes(E))M.push(E);
  await save();show();
}
function shrink(f){return new Promise(ok=>{const i=new Image();i.onload=()=>{const s=Math.min(1,600/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)})}
async function del(id){
  const m=M.find(x=>x.id==id);if(!confirm(`"${m.name}" 메뉴를 삭제할까요?`))return;
  await api('/photo?id='+id,{method:'DELETE'});M=M.filter(x=>x!=m);await save();show();
}
let P=[],tab='m';
const saveP=()=>api('/plans',{method:'POST',body:JSON.stringify(P)});
const tabs=()=>`<div style="display:flex;gap:8px;margin-bottom:8px"><button class="${tab=='m'?'':'s'}" onclick="tab='m';show()">레시피</button><button class="${tab=='p'?'':'s'}" onclick="tab='p';show()">식단</button></div>`;
function showP(){
  $('#a').innerHTML=`${tabs()}<button onclick="editP()">+ 새 식단</button> ${P.length?'':'<button class="s" onclick="seedP()">기본 식단 21개 불러오기</button>'}
  ${P.map((p,i)=>`<div class="row"><span>${esc(p.title||'식단 '+(i+1))}<small>${esc(p.items.map(t=>t.n).join(' + '))}</small></span><button class="s" onclick="mv(${i},-1)">↑</button><button class="s" onclick="mv(${i},1)">↓</button><button class="s" onclick="editP(${p.id})">수정</button><button class="r" onclick="delP(${p.id})">삭제</button></div>`).join('')}`;
}
function editP(id){
  E=P.find(x=>x.id==id)||{id:Date.now(),title:'',total:'',items:[]};
  $('#a').innerHTML=`<label>식단 이름 (비워두면 번호로 표시)</label><input id="pt" value="${esc(E.title||'')}">
  <label>메뉴 (한 줄에 하나: 메뉴명 | 분량)</label><textarea id="pi" rows="7">${esc(E.items.map(t=>t.n+' | '+(t.g||'')+(t.r==-1?' | -':'')).join('\n'))}</textarea>
  <p>등록된 레시피와 이름이 같으면 레시피로 연결돼요. 연결하지 않으려면 줄 끝에 <b>| -</b>를 붙이세요. (예: 계란찜 | 50g | -)</p>
  <label>총량</label><input id="ptt" value="${esc(E.total||'')}" placeholder="예: 140g">
  <button onclick="svP()">저장</button> <button class="s" onclick="show()">취소</button>`;
}
async function svP(){
  const old=E.items,L=$('#pi').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!L.length)return alert('메뉴를 한 줄 이상 입력하세요.');
  E.title=$('#pt').value.trim();E.total=$('#ptt').value.trim();
  E.items=L.map(l=>{const p=l.split('|').map(x=>x.trim()),nm=p[0],r=M.find(x=>x.name==nm),o=old.find(t=>t.n==nm);return{n:nm,g:p[1]||'',r:p[2]=='-'?-1:r?r.id:(o&&o.r>0?o.r:0)}});
  if(!P.includes(E))P.push(E);
  await saveP();show();
}
async function delP(id){if(!confirm('이 식단을 삭제할까요?'))return;P=P.filter(x=>x.id!=id);await saveP();show()}
async function mv(i,d){const j=i+d;if(j<0||j>=P.length)return;[P[i],P[j]]=[P[j],P[i]];await saveP();show()}
async function seedP(){try{P=await (await fetch('plans.json')).json()}catch(e){return alert('plans.json을 불러오지 못했어요. 깃허브에 plans.json이 올라가 있는지 확인해 주세요.')}await saveP();show()}
pw?init():login();
</script></body></html>
