<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fffaf2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="얌얌쑥쑥 관리자">
<link rel="manifest" href="admin-manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>얌얌쑥쑥 관리자</title>
<style>
*{box-sizing:border-box}body{margin:0 auto;max-width:720px;padding:22px 18px 70px;font:15px/1.55 system-ui,-apple-system,sans-serif;background:#fffaf1;color:#173329}h2{margin:4px 0 20px;font-size:25px}h2:before{content:'🌱 ';}input,textarea,button{font:inherit}input,textarea{width:100%;padding:13px 14px;border:1px solid #e7dfd1;border-radius:14px;background:#fff;margin:5px 0;outline:none}input:focus,textarea:focus{border-color:#4a9567;box-shadow:0 0 0 3px #4a956718}textarea{resize:vertical}button{padding:10px 14px;border-radius:12px;background:#438f61;color:#fff;border:0;cursor:pointer;font-weight:700}button.s{background:#fff;color:#294236;border:1px solid #ddd5c8}button.r{background:#fff0ec;color:#d55b42}.row{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #eee5d8;border-radius:16px;padding:12px 13px;margin:9px 0}.row span{flex:1;min-width:0}.row small{display:block;color:#8b8b80;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}label{display:block;margin-top:17px;font-weight:800}.tabs{display:flex;gap:8px;background:#f3ecdf;padding:5px;border-radius:15px;margin-bottom:16px}.tabs button{flex:1}.section{background:#fff;border:1px solid #eee5d8;border-radius:18px;padding:16px;margin:14px 0}.hint{font-size:13px;color:#8a887f;margin:5px 0 10px}.ing-row{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:center;margin:7px 0}.ing-row input{margin:0}.ing-row .url{grid-column:1/3}.ing-row button{grid-column:3;grid-row:1/3}.actions{display:flex;gap:8px;margin-top:20px}.actions button{flex:1;padding:13px}.photo-note{padding:10px 12px;background:#f6f2e9;border-radius:12px;color:#777}.topnote{color:#7b7b72;margin:-14px 0 18px}
.admin-install{margin:0 0 16px;padding:13px 14px;background:#fff;border:1px solid #eee5d8;border-radius:16px;display:flex;gap:10px;align-items:center}.admin-install span{flex:1}.admin-install b{display:block;font-size:13px}.admin-install small{color:#8a887f}.admin-install button{font-size:12px;padding:8px 10px}.install-modal{position:fixed;inset:0;background:#0006;z-index:99;display:grid;place-items:end center;padding:18px}.install-sheet{width:min(500px,100%);background:#fff;border-radius:22px;padding:22px;text-align:center}.install-sheet p{font-size:13px;color:#777;line-height:1.7}.install-sheet .steps{text-align:left;background:#f6f2e9;border-radius:14px;padding:12px;margin:12px 0}.install-sheet button{width:100%}@media(max-width:520px){.row{flex-wrap:wrap}.row span{flex-basis:100%}.ing-row{grid-template-columns:1fr auto}.ing-row .url{grid-column:1}.ing-row button{grid-column:2;grid-row:1/3}}
</style></head>
<body><h2>얌얌쑥쑥 관리자</h2><p class="topnote">식단과 레시피를 간편하게 관리하세요.</p><div id="a"></div>
<script>
const API='https://toddler-food.dltpcjsrnr.workers.dev'; // 워커 주소로 교체
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M=[],pw=sessionStorage.pw||'',E=null,deferredInstall=null;function standalone(){return matchMedia('(display-mode:standalone)').matches||navigator.standalone===true}function ios(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}function installAdminUI(){if(standalone())return '';return '<div class="admin-install"><div>🌱</div><span><b>관리자 페이지를 앱처럼 사용</b><small>홈 화면에서 바로 관리할 수 있어요.</small></span><button onclick="installAdmin()">'+(ios()?'홈 화면에 추가':'설치')+'</button></div>'}async function installAdmin(){if(ios()){document.body.insertAdjacentHTML('beforeend','<div class="install-modal" onclick="if(event.target===this)this.remove()"><div class="install-sheet"><h3>관리자 페이지 홈 화면에 추가</h3><p>Safari에서 관리자 페이지를 바로 실행할 수 있어요.</p><div class="steps"><b>1.</b> Safari의 <b>공유 ⬆</b> 버튼<br><b>2.</b> <b>홈 화면에 추가</b> 선택<br><b>3.</b> 오른쪽 위 <b>추가</b></div><button onclick="this.closest(\'.install-modal\').remove()">확인</button></div></div>');return}if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null}else alert('브라우저 메뉴에서 앱 설치 또는 홈 화면에 추가를 선택해주세요.')}addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
async function api(p,o={}){
  const r=await fetch(API+p,{...o,headers:{'x-pw':pw}});
  if(r.status==401){sessionStorage.pw=pw='';login('비밀번호가 맞지 않아요.');throw 0}
  if(!r.ok){alert('저장 실패 ('+r.status+'): 워커를 최신 코드로 배포했는지 확인해 주세요.');throw 0}
  return r;
}
function login(msg=''){$('#a').innerHTML=`<p>${msg}</p><input id="p" type="password" placeholder="관리자 비밀번호"><button onclick="go()">로그인</button>`}
async function go(){pw=$('#p').value;await api('/auth',{method:'POST'});sessionStorage.pw=pw;init()}
async function init(){M=await (await fetch(API+'/menus')).json();try{P=await (await fetch(API+'/plans')).json()}catch(e){P=[]}show()}
const save=()=>api('/menus',{method:'POST',body:JSON.stringify(M)});
function show(){
  if(tab=='p')return showP();
  $('#a').innerHTML=installAdminUI()+`${tabs()}<button onclick="edit()">+ 새 메뉴</button> ${M.length?'':'<button class="s" onclick="seed()">기본 메뉴 19개 불러오기</button>'}
  ${M.map(m=>`<div class="row"><span>${esc(m.name)}${m.ph?' 📷':''}</span><button class="s" onclick="edit(${m.id})">수정</button><button class="r" onclick="del(${m.id})">삭제</button></div>`).join('')}`;
}
async function seed(){M=await (await fetch('menus.json')).json();await save();show()}
function edit(id){
  E=M.find(x=>x.id==id)||{id:Date.now(),name:'',serve:'',ing:[],steps:[],tip:'',links:{},addedAt:new Date().toISOString()};
  const rows=E.ing.length?E.ing:[''];
  $('#a').innerHTML=`${tabs()}<div class="section"><label>메뉴명</label><input id="n" value="${esc(E.name)}" placeholder="예: 소고기 두부완자">
  <label>1회 제공량</label><input id="sv" value="${esc(E.serve)}" placeholder="예: 50g">
  <label>재료 기준 회분</label><input id="servings" type="number" min="1" step="1" value="${esc(E.servings||3)}" placeholder="예: 3">
  <p class="hint">레시피 화면에 ‘재료 (3회분)’처럼 표시돼요.</p>
  <label>재료</label><p class="hint">재료명과 용량을 입력하면 장바구니에서 쿠팡 파트너스 링크가 자동으로 생성돼요.</p>
  <div id="ings">${rows.map((x,i)=>ingRow(x,E.links||{},i)).join('')}</div><button class="s" type="button" onclick="addIng()">+ 재료 추가</button>
  <label>만드는 법</label><textarea id="st" rows="7" placeholder="한 줄에 한 단계씩 입력">${esc(E.steps.join('\n'))}</textarea>
  <label>팁 <span style="font-weight:400;color:#999">(선택)</span></label><input id="tp" value="${esc(E.tip||'')}">
  <label>대표사진</label><input id="f" type="file" accept="image/*"><div class="photo-note">${E.ph?'📷 현재 대표사진이 등록되어 있어요. 새 파일을 선택하면 교체됩니다.':'대표사진 1장을 등록해 주세요.'}</div>
  <div class="actions"><button onclick="sv()">저장하기</button><button class="s" onclick="show()">취소</button></div></div>`;
}
function splitIng(s){const m=String(s||'').match(/^(.*?)(?:\s+([~약\d][\d.~\-]*\s*(?:g|kg|ml|mL|개|알|큰술|작은술|쪽|장|컵)))?$/);return{name:(m&&m[1]?m[1]:s).trim(),amount:(m&&m[2]?m[2]:'').trim()}}
function ingRow(raw,links,i){const p=splitIng(raw);return `<div class="ing-row"><input class="in" value="${esc(p.name)}" placeholder="재료명"><input class="ia" value="${esc(p.amount)}" placeholder="용량 예: 90g"><button class="r" type="button" onclick="this.parentElement.remove()">삭제</button></div>`}
function addIng(){$('#ings').insertAdjacentHTML('beforeend',ingRow('',{},Date.now()))}
async function sv(){
  const name=$('#n').value.trim();if(!name)return alert('메뉴명을 입력하세요.');
  E.name=name;E.serve=$('#sv').value.trim();E.servings=Math.max(1,parseInt($('#servings').value)||3);E.steps=$('#st').value.split('\n').map(x=>x.trim()).filter(Boolean);E.tip=$('#tp').value.trim();delete E.links;E.ing=[];
  document.querySelectorAll('.ing-row').forEach(r=>{const n=r.querySelector('.in').value.trim(),a=r.querySelector('.ia').value.trim();if(!n)return;E.ing.push((n+(a?' '+a:'')).trim())});
  const f=$('#f').files[0];if(f){await api('/photo?id='+E.id,{method:'POST',body:await shrink(f)});E.ph=Date.now()}
  if(!M.includes(E))M.push(E);await save();show();
}
function shrink(f){return new Promise(ok=>{const i=new Image();i.onload=()=>{const s=Math.min(1,600/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)})}
async function del(id){
  const m=M.find(x=>x.id==id);if(!confirm(`"${m.name}" 메뉴를 삭제할까요?`))return;
  await api('/photo?id='+id,{method:'DELETE'});M=M.filter(x=>x!=m);await save();show();
}
let P=[],tab='m';
const saveP=()=>api('/plans',{method:'POST',body:JSON.stringify(P)});
const tabs=()=>`<div class="tabs"><button class="${tab=='m'?'':'s'}" onclick="tab='m';show()">🍳 레시피</button><button class="${tab=='p'?'':'s'}" onclick="tab='p';show()">🍱 식단</button></div>`;
function showP(){
  $('#a').innerHTML=installAdminUI()+`${tabs()}<button onclick="editP()">+ 새 식단</button> ${P.length?'':'<button class="s" onclick="seedP()">기본 식단 21개 불러오기</button>'}
  ${P.map((p,i)=>`<div class="row"><span>${esc(p.title||'식단 '+(i+1))}<small>${esc(p.items.map(t=>t.n).join(' + '))}</small></span><button class="s" onclick="mv(${i},-1)">↑</button><button class="s" onclick="mv(${i},1)">↓</button><button class="s" onclick="editP(${p.id})">수정</button><button class="r" onclick="delP(${p.id})">삭제</button></div>`).join('')}`;
}
function editP(id){
  E=P.find(x=>x.id==id)||{id:Date.now(),title:'',total:'',items:[],addedAt:new Date().toISOString()};
  $('#a').innerHTML=`<label>식단 이름 (비워두면 번호로 표시)</label><input id="pt" value="${esc(E.title||'')}">
  <label>메뉴 (한 줄에 하나: 메뉴명 | 분량)</label><textarea id="pi" rows="7">${esc(E.items.map(t=>t.n+' | '+(t.g||'')+(t.r==-1?' | -':'')).join('\n'))}</textarea>
  <p>등록된 레시피와 이름이 같으면 레시피로 연결돼요. 연결하지 않으려면 줄 끝에 <b>| -</b>를 붙이세요. (예: 계란찜 | 50g | -)</p>
  <label>총량</label><input id="ptt" value="${esc(E.total||'')}" placeholder="예: 140g">
  <label>식단 대표사진 <span style="font-weight:400;color:#999">(선택)</span></label><input id="pf" type="file" accept="image/*">
  <div class="photo-note">${E.ph?'📷 현재 식단 대표사진이 등록되어 있어요. 새 파일을 선택하면 교체됩니다.':'사진을 등록하지 않으면 포함된 레시피 사진을 사용해요.'}</div>
  ${E.ph?'<button class="r" type="button" style="margin-top:8px" onclick="delPlanPhoto()">대표사진 삭제</button>':''}
  <button onclick="svP()">저장</button> <button class="s" onclick="show()">취소</button>`;
}
async function svP(){
  const old=E.items,L=$('#pi').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!L.length)return alert('메뉴를 한 줄 이상 입력하세요.');
  E.title=$('#pt').value.trim();E.total=$('#ptt').value.trim();
  E.items=L.map(l=>{const p=l.split('|').map(x=>x.trim()),nm=p[0],r=M.find(x=>x.name==nm),o=old.find(t=>t.n==nm);return{n:nm,g:p[1]||'',r:p[2]=='-'?-1:r?r.id:(o&&o.r>0?o.r:0)}});
  const pf=$('#pf').files[0];if(pf){await api('/photo?id=plan-'+E.id,{method:'POST',body:await shrink(pf)});E.ph=Date.now()}
  if(!P.includes(E))P.push(E);
  await saveP();show();
}
async function delPlanPhoto(){if(!E.ph)return;if(!confirm('식단 대표사진을 삭제할까요?'))return;await api('/photo?id=plan-'+E.id,{method:'DELETE'});delete E.ph;await saveP();editP(E.id)}
async function delP(id){if(!confirm('이 식단을 삭제할까요?'))return;P=P.filter(x=>x.id!=id);await saveP();show()}
async function mv(i,d){const j=i+d;if(j<0||j>=P.length)return;[P[i],P[j]]=[P[j],P[i]];await saveP();show()}
async function seedP(){try{P=await (await fetch('plans.json')).json()}catch(e){return alert('plans.json을 불러오지 못했어요. 깃허브에 plans.json이 올라가 있는지 확인해 주세요.')}await saveP();show()}
pw?init():login();
</script></body></html>
