<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>유아식 식단</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f7f3;--ink:#1f3326;--sg:#5f9473;--bt:#f5d77a;--mu:#6b7d70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Gowun Dodum',sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{padding:calc(22px + env(safe-area-inset-top)) 18px 12px}
h1{margin:0;font-size:26px}header p,.mu{margin:2px 0 0;color:var(--mu);font-size:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 14px 30px}
.c{display:block;background:#fff;border-radius:18px;overflow:hidden;color:inherit;text-decoration:none}
.ph{aspect-ratio:4/3;background:var(--bt);display:grid;place-items:center;font-size:40px}
.ph img{width:100%;height:100%;object-fit:cover}
.c b{display:block;padding:10px 12px 0;line-height:1.35}.c small{display:block;padding:2px 12px 12px;color:var(--mu)}
.big{aspect-ratio:16/10;border-radius:0 0 24px 24px;overflow:hidden}
.dt{padding:12px 20px 40px;max-width:640px;margin:auto}
.bk{color:var(--sg);text-decoration:none}h2{margin:6px 0 0;font-size:24px}h3{margin:26px 0 6px;font-size:18px;border-left:5px solid var(--bt);padding-left:10px}
ul,ol{padding-left:22px;margin:0}li{margin:4px 0}
.tip{background:#fff;border-radius:12px;padding:10px 14px;margin-top:14px}
.bz{display:flex;flex-wrap:wrap;gap:8px}
.bz a{background:var(--sg);color:#fff;text-decoration:none;padding:8px 14px;border-radius:99px;font-size:15px}
.nt{font-size:12px;color:var(--mu);margin-top:10px}
</style></head>
<body><div id="app"></div>
<script>
const API='https://meal-worker.dltpcjsrnr.workers.dev'; // 워커 주소로 교체
const SHOW_PARTNER_NOTICE=false; // 쿠팡 파트너스 링크를 쓰면 true
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=s=>s.replace(/\s*(\d.*|아주 소량|소량)$/,'');
let M=[];
async function load(){
  try{M=await (await fetch(API+'/menus')).json()}catch(e){}
  if(!M.length)M=await (await fetch('menus.json')).json();
  route();
}
const img=m=>m.ph?`<img src="${API}/photo?id=${m.id}&v=${m.ph}" alt="${esc(m.name)}" loading="lazy">`:'🍲';
function route(){const m=M.find(x=>x.id==location.hash.slice(2));m?detail(m):list();scrollTo(0,0)}
function list(){
  $('#app').innerHTML=`<header><h1>유아식 식단</h1><p>메뉴를 눌러 레시피를 확인하세요 (3회분 기준)</p></header>
  <div class="g">${M.map(m=>`<a class="c" href="#/${m.id}"><div class="ph">${img(m)}</div><b>${esc(m.name)}</b><small>1회 ${esc(m.serve)}</small></a>`).join('')}</div>`;
}
function detail(m){
  const L=m.links||{};
  $('#app').innerHTML=`<div class="ph big">${img(m)}</div><div class="dt">
  <a class="bk" href="#/">← 목록</a><h2>${esc(m.name)}</h2><p class="mu">1회 제공량 ${esc(m.serve)}</p>
  <h3>재료 (3회분)</h3><ul>${m.ing.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
  <h3>만드는 법</h3><ol>${m.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
  ${m.tip?`<p class="tip">${esc(m.tip)}</p>`:''}
  <h3>재료 구매하기</h3><div class="bz">${m.ing.map(i=>{const n=nm(i),u=/^https?:\/\//.test(L[n]||'')?L[n]:'https://www.coupang.com/np/search?q='+encodeURIComponent(n);return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`}).join('')}</div>
  ${SHOW_PARTNER_NOTICE?'<p class="nt">쿠팡 파트너스 활동의 일환으로 일정 수수료를 제공받을 수 있습니다.</p>':''}</div>`;
}
addEventListener('hashchange',route);load();
</script></body></html>
